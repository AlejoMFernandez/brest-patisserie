<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#6B2951">
<title>Panel · Brest</title>
<script>
  if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../kit/kit.css?v=1">
<link rel="stylesheet" href="../kit/admin/admin.css?v=1">
<style>
@font-face { font-family: 'Gloock'; src: url('../fonts/gloock.woff') format('woff'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Chonburi'; src: url('../fonts/chonburi.woff') format('woff'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Jost'; src: url('../fonts/jost.woff') format('woff'); font-weight: 400 500; font-display: swap; }
@font-face { font-family: 'Nunito Sans'; src: url('../fonts/nunito-sans.woff') format('woff'); font-weight: 400 800; font-display: swap; }
  body { font-family: 'Nunito Sans', system-ui, sans-serif; }
  .brest-local { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: #fff; font: 700 13px/1 'Nunito Sans', system-ui, sans-serif; vertical-align: middle; margin: 0 8px; }
  .brest-local[hidden] { display: none; }
  .brest-local a { min-height: 36px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; color: #3A1430; text-decoration: none; }
  .brest-local a.on { background: #EBDD8C; }
</style>
</head>
<body>
<div id="kit-admin" class="kit-root kit-admin" aria-busy="true"></div>
<nav class="brest-local" aria-label="Local del panel" hidden>
  <a href="./?local=devoto" data-l="devoto">Devoto</a>
  <a href="./?local=luro" data-l="luro">Villa Luro</a>
</nav>
<script type="module">
  import { initAdmin } from '../kit/admin/admin.js?v=1';
  const local = new URLSearchParams(location.search).get('local') === 'luro' ? 'luro' : 'devoto';
  document.querySelectorAll('.brest-local a').forEach(a => { a.classList.toggle('on', a.dataset.l === local); if (a.dataset.l === local) a.setAttribute('aria-current', 'page'); });
  const nav = document.querySelector('.brest-local');
  new MutationObserver(() => { const d = document.querySelector('.kad-demo'); if (d && !d.contains(nav)) { const r = d.querySelector('button, [data-reset]'); r ? r.before(nav) : d.appendChild(nav); nav.hidden = false; } }).observe(document.getElementById('kit-admin'), { childList: true, subtree: true });
  initAdmin({ config: local === 'luro' ? '../cliente-luro.json' : '../cliente.json', sitio: `../?local=${local}` });
</script>
</body>
</html>
